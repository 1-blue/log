name: bluelog-career-ops-n8n

services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - career_ops
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.38.7@sha256:a8c95f75c6fdf65f5f2b7a7b354744eaa1c62bb911b5c00af6499c3f38e4cd32
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_POSTGRESDB_SCHEMA: public

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      GENERIC_TIMEZONE: Asia/Seoul
      TZ: Asia/Seoul

      EXECUTIONS_MODE: regular
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "2"
      EXECUTIONS_TIMEOUT: "900"
      EXECUTIONS_TIMEOUT_MAX: "1800"
      N8N_AI_TIMEOUT_MAX: "300000"
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "1000"

      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}
      WORKER_CALLBACK_URL: ${WORKER_CALLBACK_URL:?WORKER_CALLBACK_URL is required}
      WORKER_CALLBACK_SECRET: ${WORKER_CALLBACK_SECRET:?WORKER_CALLBACK_SECRET is required}
      WORKER_TO_N8N_SECRET: ${WORKER_TO_N8N_SECRET:?WORKER_TO_N8N_SECRET is required}
      SLACK_JOB_CHANNEL_ID: ${SLACK_JOB_CHANNEL_ID:?SLACK_JOB_CHANNEL_ID is required}
      SLACK_ERROR_WEBHOOK_URL: ${SLACK_ERROR_WEBHOOK_URL:?SLACK_ERROR_WEBHOOK_URL is required}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    networks:
      - career_ops
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider --quiet http://127.0.0.1:5678/healthz/readiness",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  career_ops:
    driver: bridge

volumes:
  n8n_data:
  postgres_data:
