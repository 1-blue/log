name: Deploy Career Ops

on:
  workflow_dispatch:
    inputs:
      target:
        description: "배포 대상"
        required: true
        default: all
        type: choice
        options:
          - worker
          - n8n
          - all

permissions:
  contents: read

concurrency:
  group: career-ops-production
  cancel-in-progress: false

jobs:
  deploy-worker:
    if: inputs.target == 'worker' || inputs.target == 'all'
    runs-on: ubuntu-latest
    environment: worker-production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify contracts and Worker
        run: |
          pnpm --filter @workspace/contracts check-schemas
          pnpm --filter @workspace/contracts check-types
          pnpm --filter worker check-types
          pnpm --filter worker test
          pnpm --filter worker build
      - name: Deploy verified SHA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID}"
          echo "Deploying Worker SHA $GITHUB_SHA"
          pnpm --filter worker run deploy

  deploy-n8n:
    if: inputs.target == 'n8n' || inputs.target == 'all'
    runs-on: ubuntu-latest
    environment: n8n-production
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow export
        run: node apps/n8n/scripts/validate-workflow.mjs
      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ vars.N8N_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.N8N_DEPLOY_USER }}
          N8N_PUBLIC_URL: ${{ vars.N8N_PUBLIC_URL }}
          WORKFLOW_ID: ${{ vars.N8N_WORKFLOW_ID }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set N8N_DEPLOY_HOST}"
          : "${DEPLOY_USER:?Set N8N_DEPLOY_USER}"
          : "${N8N_PUBLIC_URL:?Set N8N_PUBLIC_URL}"
          : "${WORKFLOW_ID:?Set N8N_WORKFLOW_ID}"
          case "$N8N_PUBLIC_URL" in
            https://*) ;;
            *) echo 'N8N_PUBLIC_URL must use HTTPS' >&2; exit 1 ;;
          esac
          if [[ "$N8N_PUBLIC_URL" == */ ]]; then
            echo 'N8N_PUBLIC_URL must not have a trailing slash' >&2
            exit 1
          fi
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.N8N_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.N8N_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?Set N8N_DEPLOY_SSH_KEY}"
          : "${SSH_KNOWN_HOSTS:?Set N8N_DEPLOY_KNOWN_HOSTS}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Copy deployment files
        env:
          DEPLOY_HOST: ${{ vars.N8N_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.N8N_DEPLOY_USER }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set N8N_DEPLOY_HOST}"
          : "${DEPLOY_USER:?Set N8N_DEPLOY_USER}"
          ssh -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p /opt/career-ops-n8n/scripts /opt/career-ops-n8n/workflows'
          rsync -av -e 'ssh -o StrictHostKeyChecking=yes' \
            apps/n8n/compose.prod.yml apps/n8n/Caddyfile \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/career-ops-n8n/"
          rsync -av -e 'ssh -o StrictHostKeyChecking=yes' \
            apps/n8n/scripts/backup-production.sh apps/n8n/scripts/deploy-production.sh apps/n8n/scripts/publish-workflow-production.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/career-ops-n8n/scripts/"
          rsync -av -e 'ssh -o StrictHostKeyChecking=yes' \
            apps/n8n/workflows/*.json \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/career-ops-n8n/workflows/"
      - name: Deploy and verify n8n
        env:
          DEPLOY_HOST: ${{ vars.N8N_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.N8N_DEPLOY_USER }}
          N8N_PUBLIC_URL: ${{ vars.N8N_PUBLIC_URL }}
          WORKFLOW_ID: ${{ vars.N8N_WORKFLOW_ID }}
        run: |
          set -euo pipefail
          : "${WORKFLOW_ID:?Set N8N_WORKFLOW_ID}"
          ssh -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash /opt/career-ops-n8n/scripts/deploy-production.sh --publish-workflow '$WORKFLOW_ID' /opt/career-ops-n8n/workflows/career-analysis.json"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 "$N8N_PUBLIC_URL/healthz/readiness")"
          test "$status" = 200
          echo "n8n readiness verified for SHA $GITHUB_SHA"
